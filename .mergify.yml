merge_protections:
  - name: require security review
    if:
      - base=main
    success_conditions:
      - label=security-reviewed

queue_rules:
  - name: default
    merge_method: merge
    merge_conditions: []

pull_request_rules:
  - name: automerge on label
    conditions:
      - label=automerge
    actions:
      merge:
