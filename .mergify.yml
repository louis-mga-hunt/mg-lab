merge_protections:
  - name: only merge overnight
    if:
      - base=main
    success_conditions:
      - schedule=00:00-01:00[UTC]

queue_rules:
  - name: default
    merge_method: merge
    merge_conditions: []

pull_request_rules:
  - name: automerge on label
    conditions:
      - label=automerge
    actions:
      merge:
